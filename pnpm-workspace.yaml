# actview 生态包发布频繁（演示期间当天发布），
# 排除 48h minimumReleaseAge 策略（同 shadcn 主仓库做法）。
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "actview"
  - "@actview/core"
  - "@actview/jsx"
  - "@actview/lucide"
  - "@actview/testing"
  - "@actview/plugin-vite"
  - "@actview/plugin-babel"
  - "@actview/base-ui"
  - "@actview/base-ui-utils"

# actview 生态全部本地链接源码仓库（packages/base-ui 已删除）：
#   - actview / @actview/core / @actview/jsx / @actview/plugin-vite / @actview/testing
#     → E:\code3\actview（源码，与 @base-ui/actview 内部依赖同一实例，避免双运行时）
#   - @base-ui/actview（完整 Base UI → actview 移植库）→ E:\code3\base-ui\packages\actview
# 详见 docs/MIGRATION.md §0
packages:
  - "packages/*"

allowBuilds:
  esbuild: true
